server {
    listen 80;
    default_type application/json;

    location = /health { return 200 '{"status":"ok"}'; }
    location ~ "^/api/cards/[0-9]{14}01$" { return 503 '{}'; }
    location ~ "^/api/cards/[0-9]{14}02$" { return 402 '{}'; }
    location ~ "^/api/cards/[0-9]{14}03$" { return 200 '{"status":"NOT_A_CARD_STATUS"}'; }

    # Later failures use a valid card read, then a specific response at reserve/rollback.
    location ~ "^/api/cards/[0-9]{14}06/reserve$" { return 402 '{}'; }
    location ~ "^/api/cards/[0-9]{14}07/reserve$" { return 404 '{}'; }
    location ~ "^/api/cards/[0-9]{14}08/reserve$" { return 400 '{}'; }
    location ~ "^/api/cards/[0-9]{14}09/reserve$" { return 503 '{}'; }
    location ~ "^/api/cards/[0-9]{14}09/rollback$" { return 503 '{}'; }
    location ~ "^/api/cards/[0-9]{16}/reserve$" { return 409 '{}'; }
    location ~ "^/api/cards/[0-9]{16}/rollback$" { return 422 '{}'; }

    location ~ "^/api/cards/(?<pan>[0-9]{16})$" {
        return 200 '{"pan":"$pan","status":"ACTIVE","expiryDate":"2099-12","availableBalance":1000,"dailyLimit":500,"monthlyLimit":1000}';
    }
}
