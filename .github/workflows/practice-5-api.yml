name: Practice 5 API contracts
on:
  push:
    branches: ['practice-5-*']
  pull_request:
    paths:
      - 'services/**'
      - 'docker-compose*.yaml'
      - 'scripts/practice-5*'
      - 'scripts/practice-5-fixtures/**'
      - '.github/workflows/practice-5-api.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: practice5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start stack
        run: docker compose --env-file .env.example -p practiclevshilin2 up -d --build --wait --wait-timeout 300
      - name: Three consecutive runs with isolated fault fixtures
        shell: pwsh
        run: ./scripts/practice-5.ps1 -SkipStack -Faults -Runs 3
      - name: Collect container logs
        if: always()
        run: >-
          docker compose --env-file .env.example -p practiclevshilin2
          -f docker-compose.yaml -f docker-compose.practice5.yaml --profile practice5 logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practice-5-api-evidence
          path: |
            services/api-tests/target/evidence/
            services/api-tests/target/surefire-reports/
            compose.log
      - name: Stop test stack
        if: always()
        run: >-
          docker compose --env-file .env.example -p practiclevshilin2
          -f docker-compose.yaml -f docker-compose.practice5.yaml --profile practice5 down
